name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        elixir: ["1.20.4"]
        otp: ["27.3.4", "28"]
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-
      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix credo --strict
      - run: mix spark.cheat_sheets --check
      - run: MIX_ENV=dev mix docs --warnings-as-errors

  without-a2ui:
    name: Without the optional ash_a2ui
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      ASH_OPERATIONS_NO_A2UI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4"
          elixir-version: "1.20.4"
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  dialyzer:
    name: Dialyzer (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4"
          elixir-version: "1.20.4"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-
      - run: mix deps.get
      - run: mix dialyzer

  # Dependency security gates (AST-181 H-03). `mix hex.audit` checks the lock
  # against Hex retirements and advisories; `mix_audit` reads its own
  # advisory database, and the two have disagreed (SDLC-96), so both run.
  # mix_audit is installed as an escript so the package's mix.exs and lock
  # stay untouched.
  audit:
    name: hex.audit + deps.audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4"
          elixir-version: "1.20.4"
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix escript.install --force hex mix_audit
      - run: ~/.mix/escripts/mix_audit
